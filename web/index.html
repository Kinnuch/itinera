<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <!-- 由 `flutter build web --base-href ...` 在构建时替换。
       部署到 GitHub Pages 的子目录时必须传对，否则资源 404。 -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="按日安排住宿、餐饮、景点与交通，自动汇总开销、检查行程是否合理，并生成路线图。">
  <meta name="theme-color" content="#2E6F6A">

  <!-- iOS「添加到主屏幕」后按独立应用启动 -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="行迹">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>行迹 · 旅行行程规划</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #FAF9F7; }
    @media (prefers-color-scheme: dark) { html, body { background: #121212; } }

    /* Flutter 首帧之前的占位。canvaskit 首次加载要下几百 KB，
       没有这个的话用户会看到一片纯色，以为页面挂了。 */
    #boot {
      position: fixed; inset: 0; display: flex; align-items: center;
      justify-content: center; flex-direction: column; gap: 14px;
      font: 14px/1.6 system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      color: #6b6b6b;
    }
    #boot .ring {
      width: 28px; height: 28px; border-radius: 50%;
      border: 3px solid rgba(46,111,106,.25); border-top-color: #2E6F6A;
      animation: spin .9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { #boot .ring { animation-duration: 3s; } }
  </style>
</head>
<body>
  <div id="boot">
    <div class="ring"></div>
    <div>正在加载行迹…</div>
  </div>

  <script>
    // Flutter 挂载后移除占位层。
    window.addEventListener('flutter-first-frame', function () {
      var boot = document.getElementById('boot');
      if (boot) boot.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
